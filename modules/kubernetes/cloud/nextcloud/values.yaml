nextcloud:
  host: cloud.__SUBDOMAIN__.__DOMAIN__
  username: admin
  datadir: /data/nextcloud
  trustedDomains:
    - cloud.__SUBDOMAIN__.__DOMAIN__
  extraEnv:
    - name: OVERWRITEPROTOCOL
      value: https
    - name: OVERWRITEHOST
      value: cloud.__SUBDOMAIN__.__DOMAIN__
    - name: TRUSTED_PROXIES
      value: 10.42.0.0/16 10.43.0.0/16 __LAN_SUBNET__
  configs:
    custom.config.php: <?php $CONFIG = array("skeletondirectory" => "");
persistence:
  enabled: true
  size: 20Gi
  nextcloudData:
    enabled: true
    existingClaim: nextcloud-data
internalDatabase:
  enabled: false
externalDatabase:
  enabled: true
  type: postgresql
  host: nextcloud-postgresql
  user: nextcloud
  database: nextcloud
postgresql:
  enabled: true
  auth:
    username: nextcloud
    database: nextcloud
  primary:
    persistence:
      enabled: true
      size: 5Gi
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
ingress:
  enabled: false
livenessProbe:
  enabled: false
readinessProbe:
  enabled: false
startupProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 10
  failureThreshold: 30
